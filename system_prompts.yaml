# 越狱提示词 —— 系统提示词库 / System Prompt Library
#
# 收录已经离开厂商控制流、被外界看到的系统提示词正文，正文本身存放在
# system_prompts/{en,zh}/ 下，本文件只存元数据与索引。
#
# 字段说明：
#   id               LSP-<年份>-<数字>；泄露时间未确认写 LSP-XXXX-<数字>
#   product          产品名
#   vender           厂商
#   time             公开 / 泄露时间（YYYY-MM 或 YYYY-MM-DD）。来源明确标明
#                    时间的按来源所标填写；未标明的，取来源链接自带的时间或
#                    来源 git 仓库的 commit 提交时间；仍无法确认才留空。禁止
#                    拿本仓库的归档 / commit 日期或文件名版本号顶替。
#   words            提示词词数（英文原文实数）
#   ljb_id           用于攻击该系统提示词的 LJB 编号；无对应条目时留空，
#                    攻击方法改写进 extra
#   source           来源链接
#   system_prompt_id 对应 system_prompts/{en,zh}/ 下的文件名（不含扩展名）
#   extra            其他有价值字段；字符串数组按链接列表渲染
#
# extra 中已使用的键：
#   leakChannel      该提示词以何种方式离开厂商控制流
#   extraction       提取手段的具体描述
#   surface          产品载体
#   disclosureType   官方公开 还是 非官方泄露
#   note             补充说明与存疑点
#
# leakChannel 取值：
#   official-release     厂商官方公开（开源码仓库、官方文档、官方 model card）
#   public-source-code   提示词直接写在随包分发的公开源码里
#   app-bundle-mining    从客户端产物 / 前端包逆向提取
#   prompt-injection     用提示词注入把系统提示词诱出来
#   user-shared          用户主动分享 / 社区流传
#   third-party-archive  第三方归档库收录，无一手官方源
#
# 未收录说明（据实记录，避免误以为已覆盖）：
#   - Grok 的 crazy conspiracist / unhinged comedian / therapist / homework helper
#     四个 persona：仅在媒体报道中被片段引用，没有归档了完整原文的公开源。
#   - Anthropic 官方 system prompt 文档页、platform.openai.com、ai.google.dev
#     在采集环境不可达，未收录。
#   - Character.AI、Arc Max、You.com、Poe、HuggingChat、通义：无权威一手来源。
#
# 内容尺度：泄露内容一律原样保留，不因粗俗、冒犯或不适而删改——脏话与侮辱性
# 表述本身就是观察厂商对齐策略失效边界的研究对象，删改会破坏归档的准确性。
#
# 收录门槛：以「是否为真实完整的产品系统提示词」为唯一标准，不设硬性词数下限。
# 真实的产品提示词可能只有几句话（如 DeepSeek Chat 全文 125 词），短不等于残缺。

