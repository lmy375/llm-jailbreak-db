# 越狱提示词 —— 系统提示词库 / System Prompt Library
#
# 收录已经离开厂商控制流、被外界看到的系统提示词正文，正文本身存放在
# content/system_prompts/{en,zh}/ 下，本文件只存元数据与索引。
#
# 顶层字段：
#   source           数据来源清单；每行 id + title + url + index_time + commit +
#                    description + description_zh。prompts[].source_id 引用这里
#                    的 id，必须存在。data_count 由构建脚本按 source_id 统计，
#                    不在此处手写。
#
# prompts 中每条记录的字段：
#   id               LSP-<年份>-<序号>；序号为 4 位数字，不足补前导 0（如
#                    LSP-2023-0001）。年份取 time 的年份；time 未知时以可得的
#                    线索时间（来源仓库 commit 时间、来源网页或其元数据的时间
#                    等）作为年份，不写 LSP-XXXX
#   product          产品名
#   vender           厂商
#   time             公开 / 泄露时间（YYYY-MM-DD；日未知时以 01 占位）。来源
#                    明确标明时间的按来源所标填写；未标明的，取来源链接自带的
#                    时间或来源 git 仓库的 commit 提交时间；仍无法确认才留空。
#                    禁止拿本仓库的归档 / commit 日期或文件名版本号顶替。
#   disclosureType   披露类型，只有两种值：official-open-source（官方开源）、
#                    leaked（泄露）
#   surface          产品载体，取值见下方 surface 取值
#   note             具体泄露方法及其他直接了解的信息（英文）
#   note_zh          note 的中文对应
#   source_id        引用顶层 source 中的 id，指向数据来源大库，必须能找到
#   source_url       具体条目的详细 URL（通常为 source 大库下的子路径）
#   system_prompt_id 对应 content/system_prompts/{en,zh}/ 下的文件名（不含扩展名）。
#                    词数不在此处手写，由构建脚本按 en 原文实数计算
#   quality_score    条目质量分（1-10 整数），人工质检标注。评分依据：是否真实
#                    完整的系统提示词正文本体、信息量与研究价值。完整但常规的
#                    正文为中等分；片段 / 子章节 / 纯元信息 / 纯解说或工具 schema、
#                    非提示词正文、重复组中被包含的次要版本为低分；完整、独特且
#                    信息量高的真实产品提示词为高分
#
# surface 取值：
#   chat / api / ide / cli / agent / browser / mobile / desktop
#
# 未收录说明（据实记录，避免误以为已覆盖）：
#   - Grok 的 crazy conspiracist / unhinged comedian / therapist / homework helper
#     四个 persona：仅在媒体报道中被片段引用，没有归档了完整原文的公开源。
#   - Anthropic 官方 system prompt 文档页、platform.openai.com、ai.google.dev
#     在采集环境不可达，未收录。
#   - Character.AI、Arc Max、You.com、Poe、HuggingChat、通义：无权威一手来源。
#
# 内容尺度：泄露内容一律原样保留，不因粗俗、冒犯或不适而删改——脏话与侮辱性
# 表述本身就是观察厂商对齐策略失效边界的研究对象，删改会破坏归档的准确性。
#
# 收录门槛：以「是否为真实完整的产品系统提示词」为唯一标准，不设硬性词数下限。
# 真实的产品提示词可能只有几句话（如 DeepSeek Chat 全文 125 词），短不等于残缺。

