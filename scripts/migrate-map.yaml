# 攻击目的清单（与 jailbreak_prompts.yaml 顶层 target 一致）/ attack-target taxonomy.
target:
  - id: dan
    name: Do Anything Now (Universal Jailbreak)
    name_zh: 通用越狱（什么都能做）
  - id: system-prompt-extraction
    name: System Prompt Extraction
    name_zh: 系统提示词提取
  - id: malicious-code
    name: Malicious Code Generation
    name_zh: 恶意代码生成
  - id: cyber-intrusion
    name: Host Intrusion & Command Execution
    name_zh: 主机入侵与命令执行
  - id: drugs
    name: Controlled-Drug Synthesis
    name_zh: 毒品与管制药物合成
  - id: medical-advice
    name: Unqualified Medical Advice
    name_zh: 违规医疗建议
  - id: crime
    name: Criminal Activity Guidance
    name_zh: 违法犯罪指导

# 条目级攻击目的覆盖（upstream id -> target id）；未列出的条目默认 dan。
# Per-entry attack-target overrides; entries not listed default to `dan`.
item_target:
  gemma3-stress-test: system-prompt-extraction
  gemma3-funny-code: malicious-code
  qwen3-funny-code: malicious-code
  phi4-policy-mirror-prompt2: system-prompt-extraction
  phi4-bos-eos-prompt3: system-prompt-extraction
  phi4-reasoning-jailbreak: medical-advice
  llama3-nesting-shot2: crime
  modern-mcp-poisoning: cyber-intrusion
  comm-4-token-boundary: system-prompt-extraction
