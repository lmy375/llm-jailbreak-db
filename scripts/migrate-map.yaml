source:
  - id: quincunx33-ai-jailbreak
    title: "Quincunx33/Ai-jailbreak"
    url: "https://github.com/Quincunx33/Ai-jailbreak"
    index_time: "2026-10-17"
    commit: "d40ff98e0cecbdb4a15ef4128021cfb44b98dfc8"
    description: "Direct archival source of this database — a curated, open collection of adversarial prompts. The schema, technique taxonomy and most entries trace back here."
    description_zh: "本数据库的直接归档来源，一份整理开放的对抗性提示词合集；本库的数据结构、技法分类与大部分条目均追溯至此。"
  - id: davidegat-happy-prompts
    title: "davidegat/happy-prompts"
    url: "https://github.com/davidegat/happy-prompts"
    index_time: "2026-10-17"
    commit: "657ed367efba72c067f01f4c70762f873020b4ce"
    description: "Layer-1 original source for the open-weight model prompts (Gemma-3, Qwen-3, Mistral, DeepSeek-R1, Phi-4)."
    description_zh: "开放权重模型（Gemma-3、Qwen-3、Mistral、DeepSeek-R1、Phi-4）相关提示词的第一层级原始来源。"
  - id: elder-plinius-l1b3rt4s
    title: "elder-plinius/L1B3RT4S"
    url: "https://github.com/elder-plinius/L1B3RT4S"
    index_time: "2026-10-17"
    commit: "64960b783249d36f76a48a33103cc4b168332b9b"
    description: "A widely referenced jailbreak prompt collection organized per model — an important reference for studying adversarial prompting."
    description_zh: "广为人知的越狱提示词合集，按模型分类整理，是研究提示词对抗技术的重要参考。"
  - id: meta-llama-llama-models
    title: "meta-llama/llama-models #121"
    url: "https://github.com/meta-llama/llama-models/issues/121"
    index_time: "2026-10-17"
    commit: "0e0b8c519242d5833d8c11bffc1232b77ad7f301"
    description: "The original discussion thread of the Llama-3 jailbreak nesting (multi-shot nesting) technique."
    description_zh: "Llama-3「越狱嵌套」（multi-shot nesting）手法的原始讨论来源。"
  - id: verazuo-jailbreak-llms
    title: "verazuo/jailbreak_llms"
    url: "https://huggingface.co/datasets/verazuo/jailbreak_llms"
    index_time: "2026-10-17"
    commit: ""
    description: "A large research-oriented jailbreak prompt dataset with accompanying code, commonly used for empirical analysis."
    description_zh: "面向研究的大规模越狱提示词数据集与配套代码，常用于实证分析。"
  - id: rubend18-chatgpt-jailbreak-prompts
    title: "rubend18/ChatGPT-Jailbreak-Prompts"
    url: "https://huggingface.co/datasets/rubend18/ChatGPT-Jailbreak-Prompts"
    index_time: "2026-10-17"
    commit: ""
    description: "A Hugging Face dataset archiving community ChatGPT jailbreak prompts."
    description_zh: "收录社区 ChatGPT 越狱提示词的 Hugging Face 数据集。"
  - id: reddit-chatgpt-dan-60
    title: "r/ChatGPT · Presenting DAN 6.0"
    url: "https://www.reddit.com/r/ChatGPT/comments/10vinun/presenting_dan_60"
    index_time: "2026-10-17"
    commit: ""
    description: "The original Reddit thread that published the DAN 6.0 role-play jailbreak."
    description_zh: "发布 DAN 6.0 角色扮演越狱的原始 Reddit 帖子。"

jailbreak_method:
  - id: fake-test
    name: Fake Test & Role Confusion
    name_zh: 伪测试与角色混淆
  - id: reasoning-trace-injection
    name: Reasoning-Trace Injection
    name_zh: 推理轨迹注入
  - id: context-flooding
    name: Context Flooding & Dilution
    name_zh: 上下文洪泛与稀释
  - id: semantic-hypnosis
    name: Semantic Hypnosis & Dissociation
    name_zh: 语义催眠与解离
  - id: reverse-thinking
    name: Reverse Thinking & Intent Inversion
    name_zh: 反向思维与意图倒置
  - id: obfuscated-encoding
    name: Obfuscated Encoding & Hallucination Pressure
    name_zh: 混淆编码与幻觉压力
  - id: multilingual-obfuscation
    name: Multilingual & Language Obfuscation
    name_zh: 多语言与语言混淆
  - id: token-boundary
    name: Token Boundary & Special Token Exploits
    name_zh: Token 边界与特殊 Token 利用
  - id: agentic-injection
    name: Agentic, Memory & Tool-Layer Injection
    name_zh: 智能体、记忆与工具层注入
  - id: crescendo-escalation
    name: Crescendo & Incremental Escalation
    name_zh: 渐进升级与增量锚定
  - id: policy-puppetry
    name: Policy Puppetry & Config Impersonation
    name_zh: 策略木偶戏与配置仿冒
  - id: logic-fallacy
    name: Logic Framing & Fallacy Failure
    name_zh: 逻辑框定与谬误诱导
  - id: system-prompt-extraction
    name: System Prompt Extraction
    name_zh: 系统提示词提取
