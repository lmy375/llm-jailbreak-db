# 越狱提示词 — 主数据文件 / LLM Jailbreak DB — jailbreak prompts data
#
# 收录已公开的大模型越狱提示词与对抗性方法，并解释每种攻击的原理。
# 本仓库只归档已公开的内容，不创作、不改进任何攻击技术。
#
# 顶层字段：
#   models            模型清单；每行仅 id + name，id 为小写加连字符格式。
#                     prompts[].model_id 引用这里的 id，必须存在。
#   jailbreak_method  越狱方法清单；每行仅 id + name + name_zh，展示顺序即声明
#                     顺序。方法指 LLM 越狱的具体做法（如伪造测试），不能是
#                     「提取系统提示词」「对齐绕过」这类泛泛的说法。方法原理
#                     文章在 jailbreak_method/{zh,en}/ 下，文件名 = 方法 id。
#   prompts           越狱提示词条目，核心数据。
#
# prompts 中每条记录的字段：
#   id                LJB-<年份>-<数字>；年份未知写 LJB-XXXX-<数字>
#   title / title_zh  标题；title 中不重复 model 名
#   model_id          引用 models 中的 id，必须能找到
#   time              提示词公开 / 出现的时间（YYYY-MM）
#   source            来源链接
#   jailbreak_method  引用 jailbreak_method 中的 id，必须能找到
#   category          条目分类：open-weights / modern-2026 / frontier / community
#   target / target_zh 攻击目的
#   prompt / prompt_zh 提示词样本；必须是可直接输入 LLM 的可用样本，不能是
#                      方法介绍或操作过程。来源中没有样本、只有方法说明的
#                      条目不入库
#   extra             其他有价值字段；字符串按文本显示，字符串数组按链接列表
#                      渲染；键名的显示文案在 i18n.yaml 的 labels.extraKeys
#                      中声明，未声明的键直接显示原键名
#
# extra 中已使用的键：
#   owasp             对应的 OWASP LLM Top 10 风险类别
#   proofs            证据链接（截图 / 复现记录等），字符串数组
#
# time 取值规则：来源明确标明时间的，按来源所标时间填写；未标明的，取来源
# 链接自带的时间或来源 git 仓库的 commit 提交时间；仍无法确认才留空，禁止
# 拿本仓库的归档 / commit 日期或文件名版本号顶替。

